# Plano B SEM Docker: mvn spring-boot:run -Dspring-boot.run.profiles=h2
spring:
  datasource:
    url: jdbc:h2:mem:escola;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  kafka:
    listener:
      auto-startup: false

app:
  kafka:
    enabled: false
